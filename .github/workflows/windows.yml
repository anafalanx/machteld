name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2025
    # The release gate intentionally performs three independent reference
    # generations: one for the build and two for determinism comparison.
    # Leave cold-bootstrap and compilation headroom on hosted runners.
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install pinned UCRT64 compiler
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc=16.1.0-5
            mingw-w64-ucrt-x86_64-binutils=2.46-3
            mingw-w64-ucrt-x86_64-make=4.4.1-4
            zip=3.0-4

      - name: Cache verified dependency prefix
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/deps
          key: machteld-windows-deps-${{ hashFiles('tools/dependencies.lock.json', 'tools/bootstrap.ps1', 'tools/bootstrap-deps.sh') }}

      - name: Bootstrap and build with warnings as errors
        env:
          MSYS2_ROOT: C:\msys64
          MACHTELD_WERROR: '1'
        run: ./tools/build.ps1

      - name: Hermetic test lanes
        env:
          MSYS2_ROOT: C:\msys64
        run: ./tools/test.ps1 -SkipBuild

      - name: Assert repository has no generated drift
        run: |
          $dirty = git status --short --untracked-files=no
          if ($dirty) { throw "build/test changed tracked files:`n$dirty" }

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: machteld-windows-x64
          path: out/machteld.exe
          if-no-files-found: error
